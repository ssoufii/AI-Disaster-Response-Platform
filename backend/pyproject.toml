[project]
name = "disaster-response-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Disaster Response Platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1.5",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a default is the FastAPI dependency-injection idiom, not a
# mutable-default bug.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
