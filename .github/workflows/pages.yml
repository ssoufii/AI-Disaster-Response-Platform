# Publishes the public demo console to GitHub Pages.
#
# Pages serves static files only, so this builds a static export (see
# frontend/next.config.ts) of the one page that needs no server of its own: the
# live console, which runs in the browser and connects to the simulation backend
# (docs/architecture.md, section 9). The routes that do need a server are
# removed first: a dispatcher's console reads a cookie and fetches at request
# time, and sign-in only exists to feed it.
#
# Where the simulation backend lives is a repository variable, DEMO_API_URL
# (Settings → Secrets and variables → Actions → Variables), e.g.
# https://your-app.koyeb.app — no trailing slash. The WebSocket URL is derived
# from it.

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Nothing to publish until the simulation backend has a URL: a console built
    # without one would point every visitor at localhost. Skipped, not failed,
    # so the site already published stays up.
    if: ${{ vars.DEMO_API_URL != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the .mts tests without flags.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run lint

      - name: Remove server-only routes
        run: rm -rf app/alerts app/sign-in

      - name: Build static export
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_LIVE_DEMO: "1"
          NEXT_PUBLIC_API_URL: ${{ vars.DEMO_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
